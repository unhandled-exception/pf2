default:
  image:
    name: dh-mirror.gitverse.ru/ubuntu:24.04
    pull_policy: if-not-present

stages:
  - test

run-tests:
  stage: test

  services:
    - name: dh-mirror.gitverse.ru/mccutchen/go-httpbin:latest
      alias: pf2-ut-httpbin
      pull_policy: if-not-present
    - name: dh-mirror.gitverse.ru/postgres:18
      alias: pf2-ut-postgres-db
      pull_policy: if-not-present
      variables:
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_DB: pg_test
    - name: dh-mirror.gitverse.ru/mysql:8.4
      alias: pf2-ut-mysql-db-8
      pull_policy: if-not-present
      variables:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_USER: test
        MYSQL_PASSWORD: test_8
        MYSQL_DATABASE: mysql_test_8
    - name: dh-mirror.gitverse.ru/mysql/mysql-server:5.7
      alias: pf2-ut-mysql-db-57
      pull_policy: if-not-present
      variables:
        MYSQL_USER: test
        MYSQL_PASSWORD: test_57
        MYSQL_DATABASE: mysql_test_57

  variables:
    # PARSER3_DIST_URL: "https://www.parser.ru/f/1/download/parser350/parser3_5_0_debian12x64.tar.gz"
    PARSER3_DIST_URL: "https://www.parser.ru/f/1/download/nightly/parser3_5_2b_debian12x64.tar.gz"

  before_script:
    - echo "Install dependencies"
    - apt-get update
    - apt-get install -y postgresql-common ca-certificates
    - /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
    - apt-get update
    - apt-get install -y curl wget postgresql-client-common postgresql-client libpq-dev libpq5
    - until pg_isready -h pf2-ut-postgres-db -U test ; do
        echo "Waiting for PostgreSQL...";
        sleep 2;
      done
    - psql postgres://test:test@pf2-ut-postgres-db/pg_test -c 'create extension if not exists pgcrypto'

  script:
    - echo "Configure Parser 3"
    - cd $HOME
    - mkdir -p $HOME/bin
    - mkdir $HOME/parser3
    - cd parser3
    - wget --no-verbose $PARSER3_DIST_URL -O parser3.tar.gz
    - tar xvfz parser3.tar.gz
    - ln -fs `pwd`/parser3.cgi $HOME/bin/
    - ln -fs `pwd`/lib $HOME/bin/lib
    - cd $CI_PROJECT_DIR
    - echo "Copy MySQL drivers"
    - cp ut/_libs/ubuntu_24.04/x64/libparser3mysql8.so $HOME/bin/lib/
    - cp ut/_libs/ubuntu_24.04/x64/libmysqlclient8.so $HOME/bin/lib/system/
    - echo "Run tests"
    - cd $CI_PROJECT_DIR
    - $HOME/bin/parser3.cgi ut/run_tests.p -v -r
